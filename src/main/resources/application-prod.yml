spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate.format_sql: false
      hibernate.jdbc.time_zone: UTC
    open-in-view: false

brevo:
  api:
    key: ${BREVO_API_KEY}

app:
  mail:
    from: ${MAIL_FROM:derwinnieves659@gmail.com}
    from-name: ${MAIL_FROM_NAME:Super Gods}

logging:
  level:
    org.hibernate.SQL: ERROR

server:
  port: ${PORT:8080}

runpod:
  enabled: ${RUNPOD_ENABLED:true}

feign:
  client:
    config:
      default:
        connectTimeout: 60000
        readTimeout: 600000

firebase:
  enabled: true


cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}


# application.yml
whatsapp:
  central:
    enabled: ${WHATSAPP_CENTRAL_ENABLED:false}
    provider: ${WHATSAPP_CENTRAL_PROVIDER:TWILIO}
    sender-label: ${WHATSAPP_CENTRAL_SENDER_LABEL:GODS Notificaciones}
    meta:
      booking-template-name: ${WHATSAPP_META_OWNER_BOOKING_TEMPLATE_NAME:owner_new_booking_v1}
      booking-template-name-pt: ${WHATSAPP_META_OWNER_BOOKING_TEMPLATE_NAME_PT:}
      booking-template-name-en: ${WHATSAPP_META_OWNER_BOOKING_TEMPLATE_NAME_EN:}
      template-language: ${WHATSAPP_META_TEMPLATE_LANGUAGE:es}
  meta:
    access-token: ${WHATSAPP_META_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_META_PHONE_NUMBER_ID:}
  twilio:
    enabled: ${WHATSAPP_TWILIO_ENABLED:false}
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_WHATSAPP_FROM_NUMBER:}
    messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}
    status-callback-url: ${TWILIO_STATUS_CALLBACK_URL:}
    owner-booking-content-sid: ${TWILIO_OWNER_BOOKING_CONTENT_SID:}
    owner-booking-content-sid-pt: ${TWILIO_OWNER_BOOKING_CONTENT_SID_PT:}
    owner-booking-content-sid-en: ${TWILIO_OWNER_BOOKING_CONTENT_SID_EN:}
    inbound-webhook-url: ${TWILIO_INBOUND_WEBHOOK_URL:}
    validate-inbound-signature: ${TWILIO_VALIDATE_INBOUND_SIGNATURE:true}

twilio:
  verify:
    enabled: ${TWILIO_VERIFY_ENABLED:false}
    service-sid: ${TWILIO_VERIFY_SERVICE_SID:}
    channel: ${TWILIO_VERIFY_CHANNEL:sms}
    api-key: ${TWILIO_VERIFY_API_KEY:}
    api-secret: ${TWILIO_VERIFY_API_SECRET:}
    ttl-seconds: ${TWILIO_VERIFY_TTL_SECONDS:600}
    resend-cooldown-seconds: ${TWILIO_VERIFY_RESEND_COOLDOWN_SECONDS:60}
