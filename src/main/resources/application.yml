spring:
  servlet:
    multipart:
      max-file-size: 40MB
      max-request-size: 40MB
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  task:
    scheduling:
      pool:
        size: 2
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate.format_sql: false
      hibernate.jdbc.time_zone: UTC
    open-in-view: false

  profiles:
    active: prod

  messages:
    basename: messages
    encoding: UTF-8

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

logging:
  level:
    org.hibernate.SQL: ERROR

server:
  port: ${PORT:8080}

tv:
  secret: TV_SECRET_ABC123

ia:
  analitica:
    url: http://localhost:8000
  ilustrativa:
    url: ${IA_ILUSTRATIVA_URL:https://jca1p4h50s2n8s-8000.proxy.runpod.net}
    health-path: /health
    generate-path: /generar
    timeout-seconds: 600
jwt:
  secret: "XJ9mA72kLq84HbUTpQwensF53vDb1ZyWRtMUa6C0xVgYpN4rKjBsfE8LdQPTh29J"
  expiration-ms: ${JWT_EXPIRATION_MS:2592000000}
  customer-expiration-ms: ${JWT_CUSTOMER_EXPIRATION_MS:15552000000}

runpod:
  enabled: ${RUNPOD_ENABLED:true}
  api-key: ${RUNPOD_API_KEY:}
  pod-id: ${RUNPOD_POD_ID:}
  api-base-url: ${RUNPOD_API_BASE_URL:https://rest.runpod.io/v1}
  inactivity-minutes: ${RUNPOD_INACTIVITY_MINUTES:15}
  health-poll-interval-millis: ${RUNPOD_HEALTH_POLL_INTERVAL_MILLIS:5000}
  health-timeout-seconds: ${RUNPOD_HEALTH_TIMEOUT_SECONDS:600}

# application.yml
whatsapp:
  central:
    enabled: ${WHATSAPP_CENTRAL_ENABLED:false}
    provider: ${WHATSAPP_CENTRAL_PROVIDER:TWILIO}
    sender-label: ${WHATSAPP_CENTRAL_SENDER_LABEL:GODS Notificaciones}
    meta:
      booking-template-name: ${WHATSAPP_META_OWNER_BOOKING_TEMPLATE_NAME:owner_new_booking_v1}
      booking-template-name-pt: ${WHATSAPP_META_OWNER_BOOKING_TEMPLATE_NAME_PT:}
      booking-template-name-en: ${WHATSAPP_META_OWNER_BOOKING_TEMPLATE_NAME_EN:}
      template-language: ${WHATSAPP_META_TEMPLATE_LANGUAGE:es}
  meta:
    access-token: ${WHATSAPP_META_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_META_PHONE_NUMBER_ID:}
  twilio:
    enabled: ${WHATSAPP_TWILIO_ENABLED:false}
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_WHATSAPP_FROM_NUMBER:}
    messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}
    status-callback-url: ${TWILIO_STATUS_CALLBACK_URL:}
    owner-booking-content-sid: ${TWILIO_OWNER_BOOKING_CONTENT_SID:}
    owner-booking-content-sid-pt: ${TWILIO_OWNER_BOOKING_CONTENT_SID_PT:}
    owner-booking-content-sid-en: ${TWILIO_OWNER_BOOKING_CONTENT_SID_EN:}
    inbound-webhook-url: ${TWILIO_INBOUND_WEBHOOK_URL:}
    validate-inbound-signature: ${TWILIO_VALIDATE_INBOUND_SIGNATURE:true}

twilio:
  verify:
    enabled: ${TWILIO_VERIFY_ENABLED:false}
    service-sid: ${TWILIO_VERIFY_SERVICE_SID:}
    channel: ${TWILIO_VERIFY_CHANNEL:sms}
    api-key: ${TWILIO_VERIFY_API_KEY:}
    api-secret: ${TWILIO_VERIFY_API_SECRET:}
    ttl-seconds: ${TWILIO_VERIFY_TTL_SECONDS:600}
    resend-cooldown-seconds: ${TWILIO_VERIFY_RESEND_COOLDOWN_SECONDS:60}

qz:
  signing:
    certificate-base64: ${QZ_SIGNING_CERTIFICATE_BASE64:}
    private-key-base64: ${QZ_SIGNING_PRIVATE_KEY_BASE64:}

electronic-invoicing:
  mifact:
    # Desactivado por defecto: desplegar el backend no emite comprobantes.
    enabled: ${MIFACT_ENABLED:false}
    base-url: ${MIFACT_BASE_URL:https://demo.mifact.net.pe/api/invoiceService.svc}
    connect-timeout-seconds: ${MIFACT_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${MIFACT_READ_TIMEOUT_SECONDS:30}
    # Lista blanca contractual por tenant. Ejemplo Railway: 1,7,12
    enabled-tenant-ids: ${MIFACT_ENABLED_TENANT_IDS:}
